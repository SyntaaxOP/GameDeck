name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install project dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -e "backend[desktop]"
          pnpm --dir frontend install --frozen-lockfile
      - name: Build FastAPI sidecar
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-sidecar.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: gamedeck-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
