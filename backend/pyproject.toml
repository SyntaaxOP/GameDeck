[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gamedeck"
version = "0.8.0"
description = "Local-first personal gaming dashboard for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.5,<3",
    "pillow>=11,<13",
    "psutil>=6,<8",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
gamedeck-demo = "gamedeck.demo:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
desktop = ["pyinstaller>=6.10,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/gamedeck"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gamedeck"]
